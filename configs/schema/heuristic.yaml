# Heuristic configuration schema (documentation-first schema)
# Required fields:
# - heuristic_id: string
# - feature_weights: mapping of feature -> numeric weight
# Optional fields:
# - thresholds: per-feature bins (list of min/max/value rules)
# - role_overrides: CB/S/slot/outside-specific overrides
heuristic_id: weighted_nfl_production_value
feature_weights:
  defensive_totalTackles: 1.0
  defensive_sacks: 2.0
  defensive_interceptions: 3.0
  defensive_passesDefended: 1.5
  defensive_gamesPlayed: 0.5
thresholds:
  defensive_interceptions:
    bins:
      - max: 1
        value: -1
      - min: 1
        max: 5
        value: 0
      - min: 5
        value: 3
role_overrides:
  CB:
    feature_weights:
      defensive_passesDefended: 1.7
      defensive_interceptions: 3.2
  S:
    feature_weights:
      defensive_totalTackles: 1.2
      defensive_sacks: 2.2
  slot:
    feature_weights:
      defensive_passesDefended: 1.8
      defensive_totalTackles: 0.9
  outside:
    feature_weights:
      defensive_passesDefended: 1.6
      defensive_interceptions: 3.4
