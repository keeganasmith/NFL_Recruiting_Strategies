<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SportsRef Final Season Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="wrap">
    <h3>Final Season Scraper</h3>
    <button id="importCombineCsvBtn">Import Combine CSV</button>
    <input id="combineCsvInput" type="file" accept=".csv,text/csv" hidden>
    <button id="exportCsvBtn">Export Matched CSV</button>
    <button id="exportJsonBtn">Export Matched JSON</button>
    <button id="exportUnmatchedCsvBtn">Export Unmatched CSV</button>
    <button id="exportRunStateJsonBtn">Export Run State JSON</button>
    <button id="startRunBtn">Start Run</button>
    <button id="pauseRunBtn">Pause Run</button>
    <button id="resumeRunBtn">Resume Run</button>
    <button id="processNextBtn">Process Next</button>
    <button id="clearBtn">Clear Saved Data</button>
    <div id="count">Saved records: 0</div>
    <div id="lookupCount">Draft-year lookup entries: 0</div>
    <div id="queueCounts">Pending: 0 | Processing: 0 | Matched: 0 | Unmatched: 0 | Errors: 0</div>
    <div id="diagnostics">
      <div><strong>Diagnostics</strong></div>
      <div id="diagQueueSize">Queue size: 0</div>
      <div id="diagPending">Pending: 0</div>
      <div id="diagImportMeta">Last import: none</div>
      <div id="diagRunStatus">Run status: idle</div>
    </div>
    <div id="throttleStatus">Next request in 0s</div>
    <textarea id="preview" readonly></textarea>
    <div id="status"></div>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
